version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: mouw-careers-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mouw_careers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mouw-careers-db:/var/lib/postgresql/data

volumes:
  mouw-careers-db:
