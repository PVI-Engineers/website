name: aws-cicd

on:
  push:
    branches: [main]
    paths:
      - "pvi-engineers/**"
      - "pvi-careers-api/**"
      - ".github/workflows/aws-cicd.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-west-2' }}
      AWS_ROLE_TO_ASSUME_APP: ${{ secrets.AWS_ROLE_TO_ASSUME_APP }}
      FRONTEND_BUCKET: ${{ secrets.FRONTEND_BUCKET }}
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check app deployment secrets
        id: secrets_check
        shell: bash
        run: |
          missing=()
          test -n "$FRONTEND_BUCKET" || missing+=("FRONTEND_BUCKET")
          test -n "$ARTIFACT_BUCKET" || missing+=("ARTIFACT_BUCKET")
          test -n "$CLOUDFRONT_DISTRIBUTION_ID" || missing+=("CLOUDFRONT_DISTRIBUTION_ID")
          test -n "$EC2_INSTANCE_ID" || missing+=("EC2_INSTANCE_ID")
          test -n "$AWS_ROLE_TO_ASSUME_APP" || missing+=("AWS_ROLE_TO_ASSUME_APP")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping app deployment. Missing secrets: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install frontend deps
        working-directory: pvi-engineers
        run: npm ci

      - name: Audit frontend production dependencies
        working-directory: pvi-engineers
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical

      - name: Build frontend
        working-directory: pvi-engineers
        run: npm run build
        env:
          VITE_API_BASE_URL: ""

      - name: Build backend
        working-directory: pvi-careers-api
        run: mvn -B -DskipTests package

      - name: App deploy skipped
        if: steps.secrets_check.outputs.ready != 'true'
        shell: bash
        run: |
          {
            echo "## App Deploy Skipped"
            echo ""
            echo "Missing required secrets: ${{ steps.secrets_check.outputs.missing }}"
            echo ""
            echo "Add these repository secrets, then re-run:"
            echo "- AWS_ROLE_TO_ASSUME_APP"
            echo "- FRONTEND_BUCKET"
            echo "- ARTIFACT_BUCKET"
            echo "- CLOUDFRONT_DISTRIBUTION_ID"
            echo "- EC2_INSTANCE_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        if: steps.secrets_check.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_APP }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend to S3
        if: steps.secrets_check.outputs.ready == 'true'
        run: aws s3 sync pvi-engineers/dist "s3://${FRONTEND_BUCKET}" --delete

      - name: Invalidate CloudFront cache
        if: steps.secrets_check.outputs.ready == 'true'
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

      - name: Upload backend artifact to S3
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          BACKEND_SHA256=$(sha256sum pvi-careers-api/target/pvi-careers-api-0.0.1-SNAPSHOT.jar | awk '{print $1}')
          echo "BACKEND_SHA256=$BACKEND_SHA256" >> "$GITHUB_ENV"
          aws s3 cp \
            pvi-careers-api/target/pvi-careers-api-0.0.1-SNAPSHOT.jar \
            "s3://${ARTIFACT_BUCKET}/backend/pvi-careers-api.jar"

      - name: Deploy backend to EC2 using SSM
        if: steps.secrets_check.outputs.ready == 'true'
        shell: bash
        run: |
          SSM_PARAMETERS_FILE="$(mktemp)"
          cat > "$SSM_PARAMETERS_FILE" <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "aws s3 cp s3://${ARTIFACT_BUCKET}/backend/pvi-careers-api.jar /opt/pvi/pvi-careers-api.jar",
              "echo ${BACKEND_SHA256}  /opt/pvi/pvi-careers-api.jar | sha256sum -c -",
              "sudo chown ec2-user:ec2-user /opt/pvi/pvi-careers-api.jar",
              "sudo systemctl daemon-reload",
              "sudo systemctl enable pvi-careers-api",
              "sudo systemctl restart pvi-careers-api",
              "if ! command -v curl >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then sudo dnf install -y curl; else sudo yum install -y curl; fi; fi",
              "if ! systemctl list-unit-files | grep -q '^nginx.service'; then if command -v dnf >/dev/null 2>&1; then sudo dnf install -y nginx; elif command -v amazon-linux-extras >/dev/null 2>&1; then sudo amazon-linux-extras install -y nginx1; else sudo yum install -y nginx; fi; fi",
              "sudo rm -f /etc/nginx/conf.d/default.conf",
              "sudo bash -c 'cat >/etc/nginx/conf.d/pvi-api.conf <<\"EOF\"\nserver {\n    listen 80 default_server;\n    server_name _;\n    server_tokens off;\n    client_max_body_size 10m;\n\n    location /api/ {\n        proxy_pass http://127.0.0.1:8080/api/;\n        proxy_http_version 1.1;\n    }\n\n    location / {\n        return 404;\n    }\n}\nEOF'",
              "sudo nginx -t",
              "sudo systemctl enable nginx",
              "sudo systemctl restart nginx",
              "if ! timeout 180 bash -c 'until curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; do sleep 3; done'; then sudo systemctl status pvi-careers-api --no-pager || true; sudo journalctl -u pvi-careers-api -n 200 --no-pager || true; exit 1; fi",
              "if ! timeout 120 bash -c 'until curl -fsS http://127.0.0.1/api/health >/dev/null 2>&1; do sleep 2; done'; then sudo systemctl status nginx --no-pager || true; sudo journalctl -u nginx -n 200 --no-pager || true; exit 1; fi",
              "curl -fsS http://127.0.0.1:8080/api/health",
              "curl -fsS http://127.0.0.1/api/health",
              "sudo -u ec2-user aws sts get-caller-identity || true",
              "PRESIGN_STATUS=\$(curl -sS -o /tmp/presign-smoke.json -w \"%{http_code}\" -H \"Content-Type: application/json\" -d '{\"files\":[{\"clientFileId\":\"smoke-1\",\"category\":\"resume\",\"fileName\":\"smoke.pdf\",\"contentType\":\"application/pdf\",\"sizeBytes\":1024}]}' http://127.0.0.1/api/careers/applications/presign || true)",
              "echo \"Presign smoke status: \$PRESIGN_STATUS\"",
              "cat /tmp/presign-smoke.json || true",
              "if [ \"\$PRESIGN_STATUS\" != \"200\" ]; then sudo systemctl status pvi-careers-api --no-pager || true; sudo journalctl -u pvi-careers-api -n 200 --no-pager || true; sudo tail -n 200 /var/log/pvi-backend.log || true; exit 1; fi"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "file://${SSM_PARAMETERS_FILE}" \
            --query "Command.CommandId" \
            --output text)

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          WAIT_EXIT_CODE=$?
          set -e

          SSM_STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "SSM status: $SSM_STATUS"
          echo "---- SSM stdout ----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
          echo "---- SSM stderr ----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text

          if [ "$WAIT_EXIT_CODE" -ne 0 ] || [ "$SSM_STATUS" != "Success" ]; then
            exit 1
          fi

          rm -f "$SSM_PARAMETERS_FILE"
