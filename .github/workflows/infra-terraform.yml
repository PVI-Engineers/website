name: infra-terraform

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/infra-terraform.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "plan, apply, or destroy"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm_destroy:
        description: "Type DESTROY to confirm infrastructure teardown (required only for destroy mode)"
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-terraform-global
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-west-2' }}
      AWS_ROLE_TO_ASSUME_INFRA: ${{ secrets.AWS_ROLE_TO_ASSUME_INFRA }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
      TF_VARS_CONTENT: ${{ secrets.TF_VARS_CONTENT }}
      TF_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate destroy confirmation
        if: env.TF_MODE == 'destroy'
        shell: bash
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "Destroy aborted. Re-run workflow with mode=destroy and confirm_destroy=DESTROY"
            exit 1
          fi

      - name: Check infra deployment secrets
        id: secrets_check
        shell: bash
        run: |
          missing=()
          test -n "$TF_STATE_BUCKET" || missing+=("TF_STATE_BUCKET")
          test -n "$TF_STATE_KEY" || missing+=("TF_STATE_KEY")
          test -n "$TF_VARS_CONTENT" || missing+=("TF_VARS_CONTENT")
          test -n "$AWS_ROLE_TO_ASSUME_INFRA" || missing+=("AWS_ROLE_TO_ASSUME_INFRA")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping infra deployment. Missing secrets: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Infra workflow skipped
        if: steps.secrets_check.outputs.ready != 'true'
        shell: bash
        run: |
          {
            echo "## Infra Workflow Skipped"
            echo ""
            echo "Missing required secrets: ${{ steps.secrets_check.outputs.missing }}"
            echo ""
            echo "Add these repository secrets, then re-run:"
            echo "- AWS_ROLE_TO_ASSUME_INFRA"
            echo "- TF_STATE_BUCKET"
            echo "- TF_STATE_KEY"
            echo "- TF_VARS_CONTENT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        if: steps.secrets_check.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_INFRA }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        if: steps.secrets_check.outputs.ready == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Bootstrap Terraform state resources
        if: steps.secrets_check.outputs.ready == 'true'
        shell: bash
        run: |
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET"
            else
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --create-bucket-configuration "LocationConstraint=${AWS_REGION}"
            fi
          fi

          aws s3api put-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" \
            --versioning-configuration Status=Enabled

      - name: Terraform Init
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          terraform -chdir=infrastructure/terraform init \
            -lock-timeout=300s \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Release stale Terraform lock
        if: steps.secrets_check.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          lock_key="${TF_STATE_KEY}.tflock"
          if aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$lock_key" >/dev/null 2>&1; then
            echo "Removing stale lock s3://${TF_STATE_BUCKET}/${lock_key}"
            aws s3api delete-object --bucket "$TF_STATE_BUCKET" --key "$lock_key"
          else
            echo "No stale lock file"
          fi

      - name: Terraform Fmt
        if: steps.secrets_check.outputs.ready == 'true' && env.TF_MODE != 'destroy'
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive

      - name: Terraform Validate
        if: steps.secrets_check.outputs.ready == 'true' && env.TF_MODE != 'destroy'
        run: terraform -chdir=infrastructure/terraform validate

      - name: Write Terraform variables
        if: steps.secrets_check.outputs.ready == 'true'
        shell: bash
        run: |
          TF_VARS_FILE="${RUNNER_TEMP}/terraform.auto.tfvars"
          printf '%s\n' "$TF_VARS_CONTENT" > "$TF_VARS_FILE"
          echo "TF_VARS_FILE=$TF_VARS_FILE" >> "$GITHUB_ENV"

      - name: Terraform Plan
        if: steps.secrets_check.outputs.ready == 'true' && env.TF_MODE != 'destroy'
        run: |
          terraform -chdir=infrastructure/terraform plan -lock-timeout=300s \
            -var-file="${TF_VARS_FILE}" \
            -var="bootstrap_admin_username=admin@mouw.local" \
            -var="bootstrap_admin_password=Admin@123" \
            -var="bootstrap_admin_full_name=MOUW Admin" \
            -var="bootstrap_admin_email=admin@mouwengineering.com" \
            -var="bootstrap_hr_username=hr@mouw.local" \
            -var="bootstrap_hr_password=Hr@123" \
            -var="bootstrap_hr_full_name=MOUW HR" \
            -var="bootstrap_hr_email=hr@mouwengineering.com" \
            -var="bootstrap_employee_username=employee@mouw.local" \
            -var="bootstrap_employee_password=Employee@123" \
            -var="bootstrap_employee_full_name=MOUW Employee" \
            -var="bootstrap_employee_email=employee@mouwengineering.com" \
            -var="mail_from_address=no-reply@mouwengineering.com" \
            -var="company_mail_to=hr@mouwengineering.com" \
            -var="contact_mail_to=contact@mouwengineering.com" \
            -var="project_name=mouw" \
            -var="frontend_bucket_name=mouw-engineers-prod-frontend" \
            -var="resume_bucket_name=mouw-engineers-prod-resumes" \
            -var="artifacts_bucket_name=mouw-engineers-prod-artifacts" \
            -var="db_name=mouw_careers" \
            -var="db_username=mouw_admin" \
            -var="rds_deletion_protection=false" \
            -var="rds_skip_final_snapshot=true" \
            -out=tfplan

      - name: Allow replacement of the old database and buckets
        if: steps.secrets_check.outputs.ready == 'true' && env.TF_MODE == 'apply'
        shell: bash
        run: |
          set -euo pipefail

          empty_bucket() {
            local bucket="$1"
            if [ -z "$bucket" ] || [ "$bucket" = "null" ]; then
              return 0
            fi
            if ! aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
              echo "Bucket ${bucket} is already gone"
              return 0
            fi

            echo "Removing all object versions from s3://${bucket}"
            while true; do
              response="$(aws s3api list-object-versions --bucket "$bucket" --output json 2>/dev/null || echo '{}')"
              object_count="$(echo "$response" | jq '((.Versions // []) + (.DeleteMarkers // [])) | length' || echo 0)"
              if [ "${object_count:-0}" -eq 0 ]; then
                echo "Bucket ${bucket} has no remaining versions"
                break
              fi
              payload="$(echo "$response" | jq -c '{Objects: ((.Versions // []) + (.DeleteMarkers // [])) | map({Key: .Key, VersionId: .VersionId})}')"
              aws s3api delete-objects --bucket "$bucket" --delete "$payload"
            done
          }

          for bucket in \
            pvi-engineers-prod-frontend \
            pvi-engineers-prod-resumes \
            pvi-engineers-prod-artifacts
          do
            empty_bucket "$bucket"
          done

          for address in aws_s3_bucket.frontend aws_s3_bucket.resumes aws_s3_bucket.artifacts; do
            bucket="$(terraform -chdir=infrastructure/terraform state show -no-color "$address" 2>/dev/null | awk -F'"' '/^ *bucket / { print $2; exit }' || true)"
            empty_bucket "$bucket"
          done

          identifier="$(terraform -chdir=infrastructure/terraform state show -no-color aws_db_instance.postgres 2>/dev/null | awk -F'"' '/^ *identifier / { print $2; exit }' || true)"
          if [ -z "$identifier" ]; then
            identifier="pvi-prod-postgres"
          fi

          if aws rds describe-db-instances --db-instance-identifier "$identifier" >/dev/null 2>&1; then
            echo "Turning off deletion protection for ${identifier}"
            aws rds modify-db-instance \
              --db-instance-identifier "$identifier" \
              --no-deletion-protection \
              --apply-immediately >/dev/null
            aws rds wait db-instance-available --db-instance-identifier "$identifier"
          else
            echo "Database ${identifier} is already gone"
          fi

      - name: Terraform Apply on Manual Trigger
        if: steps.secrets_check.outputs.ready == 'true' && env.TF_MODE == 'apply'
        run: terraform -chdir=infrastructure/terraform apply -lock-timeout=300s -auto-approve tfplan

      - name: Delete the database before destroy
        if: steps.secrets_check.outputs.ready == 'true' && env.TF_MODE == 'destroy'
        shell: bash
        run: |
          set -euo pipefail

          delete_db() {
            local identifier="$1"
            if ! aws rds describe-db-instances --db-instance-identifier "$identifier" >/dev/null 2>&1; then
              echo "Database ${identifier} is already gone"
              return 0
            fi

            local status
            status="$(aws rds describe-db-instances --db-instance-identifier "$identifier" --query "DBInstances[0].DBInstanceStatus" --output text)"
            if [ "$status" = "deleting" ]; then
              echo "Waiting for ${identifier} to finish deleting"
              aws rds wait db-instance-deleted --db-instance-identifier "$identifier"
              return 0
            fi

            echo "Turning off deletion protection for ${identifier}"
            aws rds modify-db-instance \
              --db-instance-identifier "$identifier" \
              --no-deletion-protection \
              --apply-immediately >/dev/null
            aws rds wait db-instance-available --db-instance-identifier "$identifier"

            echo "Deleting database ${identifier}"
            aws rds delete-db-instance \
              --db-instance-identifier "$identifier" \
              --skip-final-snapshot \
              --delete-automated-backups >/dev/null
            aws rds wait db-instance-deleted --db-instance-identifier "$identifier"
          }

          delete_db "pvi-prod-postgres"
          delete_db "mouw-prod-postgres"

      - name: Empty application S3 buckets before destroy
        if: steps.secrets_check.outputs.ready == 'true' && env.TF_MODE == 'destroy'
        shell: bash
        run: |
          set -euo pipefail

          empty_bucket() {
            local bucket="$1"
            if [ -z "$bucket" ] || [ "$bucket" = "null" ]; then
              return 0
            fi
            if ! aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
              echo "Bucket ${bucket} is already gone"
              return 0
            fi

            echo "Removing all object versions from s3://${bucket}"
            aws s3 rm "s3://${bucket}" --recursive || true
            while true; do
              response="$(aws s3api list-object-versions --bucket "$bucket" --output json 2>/dev/null || echo '{}')"
              object_count="$(echo "$response" | jq '((.Versions // []) + (.DeleteMarkers // [])) | length' || echo 0)"
              if [ "${object_count:-0}" -eq 0 ]; then
                break
              fi
              payload="$(echo "$response" | jq -c '{Objects: ((.Versions // []) + (.DeleteMarkers // [])) | map({Key: .Key, VersionId: .VersionId})}')"
              aws s3api delete-objects --bucket "$bucket" --delete "$payload"
            done
          }

          for bucket in \
            pvi-engineers-prod-frontend \
            pvi-engineers-prod-resumes \
            pvi-engineers-prod-artifacts \
            mouw-engineers-prod-frontend \
            mouw-engineers-prod-resumes \
            mouw-engineers-prod-artifacts
          do
            empty_bucket "$bucket"
          done

          for address in aws_s3_bucket.frontend aws_s3_bucket.resumes aws_s3_bucket.artifacts; do
            bucket="$(terraform -chdir=infrastructure/terraform state show -no-color "$address" 2>/dev/null | awk -F'"' '/^ *bucket / { print $2; exit }' || true)"
            empty_bucket "$bucket"
          done

      - name: Remove leftover VPC dependencies before destroy
        if: steps.secrets_check.outputs.ready == 'true' && env.TF_MODE == 'destroy'
        shell: bash
        run: |
          set -euo pipefail

          vpc_id="$(terraform -chdir=infrastructure/terraform state show -no-color aws_vpc.main 2>/dev/null | awk -F'"' '/^ *id / { print $2; exit }' || true)"
          if [ -z "$vpc_id" ]; then
            vpc_id="vpc-03ed461b020976418"
          fi
          if ! aws ec2 describe-vpcs --vpc-ids "$vpc_id" >/dev/null 2>&1; then
            echo "VPC ${vpc_id} is already gone"
            exit 0
          fi

          echo "Removing leftovers in ${vpc_id}"

          for nat in $(aws ec2 describe-nat-gateways --filter "Name=vpc-id,Values=${vpc_id}" --query "NatGateways[?State!='deleted'].NatGatewayId" --output text); do
            [ "$nat" = "None" ] && continue
            aws ec2 delete-nat-gateway --nat-gateway-id "$nat" || true
          done

          for igw in $(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=${vpc_id}" --query "InternetGateways[].InternetGatewayId" --output text); do
            [ "$igw" = "None" ] && continue
            aws ec2 detach-internet-gateway --internet-gateway-id "$igw" --vpc-id "$vpc_id" || true
            aws ec2 delete-internet-gateway --internet-gateway-id "$igw" || true
          done

          endpoints="$(aws ec2 describe-vpc-endpoints --filters "Name=vpc-id,Values=${vpc_id}" --query "VpcEndpoints[].VpcEndpointId" --output text)"
          if [ -n "$endpoints" ] && [ "$endpoints" != "None" ]; then
            aws ec2 delete-vpc-endpoints --vpc-endpoint-ids $endpoints || true
          fi

          for eni in $(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=${vpc_id}" --query "NetworkInterfaces[].NetworkInterfaceId" --output text); do
            [ "$eni" = "None" ] && continue
            attachment="$(aws ec2 describe-network-interfaces --network-interface-ids "$eni" --query "NetworkInterfaces[0].Attachment.AttachmentId" --output text || true)"
            if [ -n "$attachment" ] && [ "$attachment" != "None" ]; then
              aws ec2 detach-network-interface --attachment-id "$attachment" --force || true
            fi
            aws ec2 delete-network-interface --network-interface-id "$eni" || true
          done

          for subnet in $(aws ec2 describe-subnets --filters "Name=vpc-id,Values=${vpc_id}" --query "Subnets[].SubnetId" --output text); do
            [ "$subnet" = "None" ] && continue
            aws ec2 delete-subnet --subnet-id "$subnet" || true
          done

          groups="$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=${vpc_id}" --query "SecurityGroups[?GroupName!='default'].GroupId" --output text)"
          for group in $groups; do
            [ "$group" = "None" ] && continue
            aws ec2 revoke-security-group-ingress --group-id "$group" --ip-permissions "$(aws ec2 describe-security-groups --group-ids "$group" --query "SecurityGroups[0].IpPermissions" --output json)" >/dev/null 2>&1 || true
            aws ec2 revoke-security-group-egress --group-id "$group" --ip-permissions "$(aws ec2 describe-security-groups --group-ids "$group" --query "SecurityGroups[0].IpPermissionsEgress" --output json)" >/dev/null 2>&1 || true
          done
          for group in $groups; do
            [ "$group" = "None" ] && continue
            aws ec2 delete-security-group --group-id "$group" || true
          done

          main_route="$(aws ec2 describe-vpcs --vpc-ids "$vpc_id" --query "Vpcs[0].MainRouteTableId" --output text)"
          for route in $(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=${vpc_id}" --query "RouteTables[].RouteTableId" --output text); do
            [ "$route" = "None" ] && continue
            if [ "$route" != "$main_route" ]; then
              aws ec2 delete-route-table --route-table-id "$route" || true
            fi
          done

      - name: Terraform Destroy on Manual Trigger
        if: steps.secrets_check.outputs.ready == 'true' && env.TF_MODE == 'destroy'
        run: |
          terraform -chdir=infrastructure/terraform destroy -lock-timeout=300s -auto-approve \
            -var-file="${TF_VARS_FILE}" \
            -var="rds_deletion_protection=false" \
            -var="rds_skip_final_snapshot=true"

      - name: Publish Outputs Summary
        if: steps.secrets_check.outputs.ready == 'true' && env.TF_MODE == 'apply'
        shell: bash
        run: |
          {
            echo "## Terraform Outputs"
            echo ""
            echo "- frontend_url: $(terraform -chdir=infrastructure/terraform output -raw frontend_url)"
            echo "- cloudfront_distribution_id: $(terraform -chdir=infrastructure/terraform output -raw cloudfront_distribution_id)"
            echo "- frontend_bucket_name: $(terraform -chdir=infrastructure/terraform output -raw frontend_bucket_name)"
            echo "- artifacts_bucket_name: $(terraform -chdir=infrastructure/terraform output -raw artifacts_bucket_name)"
            echo "- ec2_instance_id: $(terraform -chdir=infrastructure/terraform output -raw ec2_instance_id)"
            echo "- github_actions_role_arn: $(terraform -chdir=infrastructure/terraform output -raw github_actions_role_arn)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Destroy Summary
        if: steps.secrets_check.outputs.ready == 'true' && env.TF_MODE == 'destroy'
        shell: bash
        run: |
          {
            echo "## Terraform Destroy Completed"
            echo ""
            echo "Infrastructure resources managed by this Terraform state were destroyed."
            echo ""
            echo "Still review AWS Billing after 24-48 hours."
            echo "These may remain unless deleted manually:"
            echo "- Terraform state bucket: ${TF_STATE_BUCKET}"
            echo "- Route53 hosted zone (if recreated outside Terraform)"
            echo "- Domain registration at your registrar"
            echo ""
            echo "To redeploy later, run this workflow with mode=apply."
          } >> "$GITHUB_STEP_SUMMARY"
